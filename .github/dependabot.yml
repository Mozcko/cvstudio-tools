version: 2
updates:
  # npm dependencies (pnpm lockfile)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # One pull request for the routine minor/patch bumps; majors come one by one
      minor-and-patch:
        update-types: [ minor, patch ]

  # Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: [ '*' ]
