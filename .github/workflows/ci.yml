name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer push to the same branch or pull request replaces the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Astro requires Node >= 22.12
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: 🔤 Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Reports known vulnerabilities in production dependencies. Informational for now
  # (not part of "CI passed"): make it blocking once the report is clean.
  audit:
    name: 🔒 Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Audit production dependencies
        run: |
          if ! pnpm audit --prod; then
            echo "::warning::pnpm audit reports known vulnerabilities in production dependencies (see this job's log)."
          fi

  # Browser tests against the production build. They need keys from a Clerk DEVELOPMENT
  # instance (the app cannot render without Clerk):
  #   repository variable  E2E_CLERK_PUBLISHABLE_KEY   pk_test_...
  #   repository secret    E2E_CLERK_SECRET_KEY        sk_test_...   (also as a Dependabot secret)
  # Until the variable exists the job is skipped, and shows as skipped on the pull request.
  e2e:
    name: 🎭 End-to-End
    if: vars.E2E_CLERK_PUBLISHABLE_KEY != ''
    runs-on: ubuntu-latest
    env:
      PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
    steps:
      - name: Check configuration
        run: |
          # Secrets cannot be tested in a job condition, so a missing one fails here instead
          # of letting the build run with an empty key
          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::error::E2E_CLERK_PUBLISHABLE_KEY is set but the secret E2E_CLERK_SECRET_KEY is missing (for Dependabot pull requests it must also be a Dependabot secret). See docs/development.md."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install the browser's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Build
        run: pnpm build
      - name: Run end-to-end tests
        run: pnpm test:e2e
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Single status to require in branch protection: green only if every required job is green.
  ci-passed:
    name: ✅ CI passed
    if: always()
    needs: [lint, typecheck, unit, build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          REQUIRED: ${{ needs.lint.result }} ${{ needs.typecheck.result }} ${{ needs.unit.result }} ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "Required jobs: $REQUIRED"
          echo "End-to-end: $E2E"
          for result in $REQUIRED; do
            if [ "$result" != "success" ]; then
              echo "::error::At least one CI job did not succeed"
              exit 1
            fi
          done
          # End-to-end may be skipped (not configured yet) but must never fail
          if [ "$E2E" != "success" ] && [ "$E2E" != "skipped" ]; then
            echo "::error::End-to-end tests did not succeed"
            exit 1
          fi
