name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer push to the same branch or pull request replaces the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Astro requires Node >= 22.12
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: 🔤 Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Known vulnerabilities in what ships to production block the merge when they are high or
  # critical. Everything else (lower severity, development-only packages) is reported.
  audit:
    name: 🔒 Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Production dependencies (blocking from "high")
        run: pnpm audit --prod --audit-level high
      - name: All dependencies (report only)
        if: always()
        run: |
          if ! pnpm audit; then
            echo "::warning::pnpm audit reports known vulnerabilities (see this job's log)."
          fi

  # Browser tests against the production build. They need keys from a Clerk DEVELOPMENT
  # instance (the app cannot render without Clerk):
  #   repository variable  E2E_CLERK_PUBLISHABLE_KEY   pk_test_...
  #   repository secret    E2E_CLERK_SECRET_KEY        sk_test_...   (also as a Dependabot secret)
  # Until the variable exists the job is skipped, and shows as skipped on the pull request.
  e2e:
    name: 🎭 End-to-End
    if: vars.E2E_CLERK_PUBLISHABLE_KEY != ''
    runs-on: ubuntu-latest
    # Normally about three minutes. A stuck download must fail, not hold the pull request
    timeout-minutes: 20
    env:
      PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
      # The test user of the Clerk development instance (created on first use); enables the
      # signed-in tests
      E2E_USER_EMAIL: ${{ vars.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      # The backend the signed-in tests talk to (started below, from its main branch)
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/cvstudio_e2e
      FRONTEND_URL: http://127.0.0.1:4399
      ENVIRONMENT: test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cvstudio_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check configuration
        run: |
          # Secrets cannot be tested in a job condition, so a missing one fails here instead
          # of letting the build run with an empty key
          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "::error::E2E_CLERK_PUBLISHABLE_KEY is set but the secret E2E_CLERK_SECRET_KEY is missing (for Dependabot pull requests it must also be a Dependabot secret). See docs/development.md."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The system packages come from a package mirror that occasionally hangs: give each
      # attempt a few minutes and try once more before giving up
      - name: Install the browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: |
          timeout 300 pnpm exec playwright install --with-deps chromium \
            || timeout 300 pnpm exec playwright install --with-deps chromium
      - name: Install the browser's system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: |
          timeout 240 pnpm exec playwright install-deps chromium \
            || timeout 240 pnpm exec playwright install-deps chromium
      - name: Build
        run: pnpm build

      # ── Backend for the signed-in tests ──────────────────────────────────
      - name: Check out the backend
        uses: actions/checkout@v7
        with:
          repository: Mozcko/cvstudio-tools-backend
          path: backend
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install the backend
        run: pip install -r backend/requirements.txt
      - name: Start the backend
        working-directory: backend
        run: |
          # The instance's address is encoded in the publishable key: pk_test_<base64 of "host$">
          host=$(echo "${PUBLIC_CLERK_PUBLISHABLE_KEY#pk_test_}" | base64 --decode 2>/dev/null | tr -d '$')
          if [ -z "$host" ]; then
            echo "::error::E2E_CLERK_PUBLISHABLE_KEY is not a development key (pk_test_...)"
            exit 1
          fi
          export CLERK_ISSUER="https://$host"
          alembic upgrade head
          nohup uvicorn src.main:app --host 127.0.0.1 --port 8000 > ../backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend is up (attempt $attempt)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::The backend did not start"
          cat ../backend.log
          exit 1

      - name: Run end-to-end tests
        run: pnpm test:e2e
      - name: Backend log
        if: failure()
        run: cat backend.log || true
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Single status to require in branch protection: green only if every required job is green.
  ci-passed:
    name: ✅ CI passed
    if: always()
    needs: [lint, typecheck, unit, build, audit, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          REQUIRED: ${{ needs.lint.result }} ${{ needs.typecheck.result }} ${{ needs.unit.result }} ${{ needs.build.result }} ${{ needs.audit.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "Required jobs: $REQUIRED"
          echo "End-to-end: $E2E"
          for result in $REQUIRED; do
            if [ "$result" != "success" ]; then
              echo "::error::At least one CI job did not succeed"
              exit 1
            fi
          done
          # End-to-end may be skipped (not configured yet) but must never fail
          if [ "$E2E" != "success" ] && [ "$E2E" != "skipped" ]; then
            echo "::error::End-to-end tests did not succeed"
            exit 1
          fi
