name: CI Quality Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-lint:
    name: 🛡️ Frontend Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Astro 6 requires Node >= 22.12
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm lint

      - name: Type Check
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test

      - name: Build Project
        run: pnpm build

# The backend has its own repository (cvstudio-tools-backend) and its own workflow.
# End-to-end tests (tests/*.spec.ts) are not run here yet: Playwright still has to be
# added as a dependency and configured. See docs/known-issues.md.
