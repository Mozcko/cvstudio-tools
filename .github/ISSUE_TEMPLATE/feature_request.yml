name: 🚀 Feature request
description: Suggest a change or an addition
title: "[FEAT] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: This would touch
      options:
        - label: The CV data model or the Markdown format
        - label: A CV theme or the PDF output
        - label: The backend API (needs a matching backend change)
        - label: Plans, limits or pricing
        - label: Translations (es / en / pt)
